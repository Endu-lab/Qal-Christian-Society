<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qal - Christian Community Quiz | Church, Para-church & Individual Competition</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abyssinica+SIL&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script type="module">
        // ============================================================
        // STEP 1: REPLACE WITH YOUR FIREBASE CONFIGURATION
        // Get this from: https://console.firebase.google.com -> Project Settings
        // ============================================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        // Initialize Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, orderBy, limit, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // ============================================================
        // APPLICATION STATE
        // ============================================================
        let currentUser = null;
        let currentOrgType = null; // 'church', 'parachurch', 'individual'
        let currentOrgName = null;
        let currentQuiz = null;
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let userScore = 0;
        
        // Sample Quiz Questions (Biblical knowledge)
        const SAMPLE_QUIZZES = {
            'bible-basics': {
                id: 'bible-basics',
                title: 'ቤተ ክርስቲያን መሰረታዊ እውቀት',
                titleEn: 'Bible Basics',
                questions: [
                    { text: 'የኢየሱስ እናት ማን ናት?', options: ['ማርያም', 'ኤልሳቤጥ', 'ማርታ', 'ራሄል'], correct: 0 },
                    { text: 'ዳዊት ጎልያድን የገደለው በምን ነው?', options: ['ጦር', 'ቀስት', 'ወንጭፍ', 'አንበጣ'], correct: 2 },
                    { text: 'ኖኅ መርከብ የሠራው በምን እንጨት ነው?', options: ['እርዘ ዘይት', 'ጎፈር', 'ኪያር', 'በራሚን'], correct: 1 },
                    { text: 'ሙሴ ባሕሩን የከፈለው የትኛው ባሕር ነው?', options: ['ሙት ባሕር', 'ቀይ ባሕር', 'ገሊላ ባሕር', 'ሜዲትራኒያን'], correct: 1 },
                    { text: 'የክርስትና ሃይማኖት ቅዱስ መጽሐፍ ስንት መጻሕፍት አሉት?', options: ['66', '73', '39', '27'], correct: 0 }
                ]
            }
        };
        
        // ============================================================
        // UI ELEMENTS
        // ============================================================
        const appContainer = document.getElementById('app');
        
        function renderAuth() {
            appContainer.innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="logo-section">
                            <i class="fas fa-cross"></i>
                            <h1>ቃል</h1>
                            <p class="subtitle">Christian Community Quiz Platform</p>
                        </div>
                        
                        <div class="org-type-selector">
                            <h3>Select Organization Type</h3>
                            <div class="org-buttons">
                                <button class="org-btn" data-org="church">
                                    <i class="fas fa-church"></i>
                                    <span>Church</span>
                                    <small>Local congregation</small>
                                </button>
                                <button class="org-btn" data-org="parachurch">
                                    <i class="fas fa-hands-helping"></i>
                                    <span>Para-church</span>
                                    <small>Ministry organization</small>
                                </button>
                                <button class="org-btn" data-org="individual">
                                    <i class="fas fa-user"></i>
                                    <span>Individual</span>
                                    <small>Personal account</small>
                                </button>
                            </div>
                        </div>
                        
                        <div id="orgNameInput" style="display:none;" class="org-name-input">
                            <input type="text" id="orgNameField" placeholder="Enter your Church/Organization name">
                        </div>
                        
                        <div class="auth-tabs">
                            <button class="tab-btn active" data-tab="login">Login</button>
                            <button class="tab-btn" data-tab="signup">Sign Up</button>
                        </div>
                        
                        <div id="loginForm" class="auth-form active">
                            <input type="email" id="loginEmail" placeholder="Email">
                            <input type="password" id="loginPassword" placeholder="Password">
                            <button id="loginBtn" class="btn-primary">Login</button>
                        </div>
                        
                        <div id="signupForm" class="auth-form">
                            <input type="text" id="signupName" placeholder="Full Name">
                            <input type="email" id="signupEmail" placeholder="Email">
                            <input type="password" id="signupPassword" placeholder="Password (min 6 chars)">
                            <button id="signupBtn" class="btn-primary">Sign Up</button>
                        </div>
                    </div>
                </div>
            `;
            
            // Organization selection
            let selectedOrg = null;
            document.querySelectorAll('.org-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.org-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedOrg = btn.dataset.org;
                    const orgNameDiv = document.getElementById('orgNameInput');
                    if (selectedOrg !== 'individual') {
                        orgNameDiv.style.display = 'block';
                    } else {
                        orgNameDiv.style.display = 'none';
                    }
                });
            });
            
            // Tab switching
            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById('loginForm').classList.toggle('active', tabName === 'login');
                    document.getElementById('signupForm').classList.toggle('active', tabName === 'signup');
                });
            });
            
            // Login handler
            document.getElementById('loginBtn').addEventListener('click', async () => {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                } catch (error) {
                    alert('Login failed: ' + error.message);
                }
            });
            
            // Signup handler
            document.getElementById('signupBtn').addEventListener('click', async () => {
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;
                const orgType = selectedOrg;
                
                if (!orgType) {
                    alert('Please select organization type');
                    return;
                }
                if (orgType !== 'individual' && !document.getElementById('orgNameField').value) {
                    alert('Please enter organization name');
                    return;
                }
                
                try {
                    const userCred = await createUserWithEmailAndPassword(auth, email, password);
                    const orgName = orgType !== 'individual' ? document.getElementById('orgNameField').value : name;
                    
                    // Save user profile to Firestore
                    await setDoc(doc(db, 'users', userCred.user.uid), {
                        name: name,
                        email: email,
                        orgType: orgType,
                        orgName: orgName,
                        createdAt: new Date()
                    });
                    
                    // Create organization document if church/parachurch
                    if (orgType !== 'individual') {
                        const orgRef = doc(db, 'organizations', orgType + '_' + orgName.replace(/\s/g, '_'));
                        const orgDoc = await getDoc(orgRef);
                        if (!orgDoc.exists()) {
                            await setDoc(orgRef, {
                                name: orgName,
                                type: orgType,
                                members: [userCred.user.uid],
                                totalScore: 0,
                                quizzesTaken: 0,
                                createdAt: new Date()
                            });
                        } else {
                            await updateDoc(orgRef, {
                                members: arrayUnion(userCred.user.uid)
                            });
                        }
                    }
                    
                    alert('Account created successfully!');
                } catch (error) {
                    alert('Signup failed: ' + error.message);
                }
            });
        }
        
        function renderDashboard() {
            const orgIcon = currentOrgType === 'church' ? 'fa-church' : (currentOrgType === 'parachurch' ? 'fa-hands-helping' : 'fa-user');
            const orgTypeName = currentOrgType === 'church' ? 'Church' : (currentOrgType === 'parachurch' ? 'Para-church' : 'Individual');
            
            appContainer.innerHTML = `
                <div class="dashboard">
                    <div class="dashboard-header">
                        <div class="user-badge">
                            <i class="fas ${orgIcon}"></i>
                            <div>
                                <strong>${currentOrgName}</strong>
                                <small>${orgTypeName}</small>
                            </div>
                        </div>
                        <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                    </div>
                    
                    <div class="leaderboard-section">
                        <h2><i class="fas fa-trophy"></i> Competitive Leaderboard</h2>
                        <div class="leaderboard-filters">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="church">Churches</button>
                            <button class="filter-btn" data-filter="parachurch">Para-churches</button>
                            <button class="filter-btn" data-filter="individual">Individuals</button>
                        </div>
                        <div id="leaderboardList" class="leaderboard-list">
                            <div class="loading">Loading rankings...</div>
                        </div>
                    </div>
                    
                    <div class="quiz-section">
                        <h2><i class="fas fa-question-circle"></i> Available Quizzes</h2>
                        <div class="quiz-cards">
                            <div class="quiz-card" data-quiz="bible-basics">
                                <i class="fas fa-bible"></i>
                                <h3>ቤተ ክርስቲያን መሰረታዊ እውቀት</h3>
                                <p>Bible Basics Quiz - 5 Questions</p>
                                <button class="start-quiz-btn">Start Quiz <i class="fas fa-arrow-right"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="competitive-section">
                        <h2><i class="fas fa-flag-checkered"></i> Competitive Mode</h2>
                        <p class="competitive-info">Compete against other ${orgTypeName}s! Your score will be added to the leaderboard.</p>
                        <div class="stats-box">
                            <div class="stat">
                                <span class="stat-label">Your Best Score</span>
                                <span class="stat-value" id="userBestScore">-</span>
                            </div>
                            <div class="stat">
                                <span class="stat-label">Organization Rank</span>
                                <span class="stat-value" id="orgRank">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Load leaderboard
            loadLeaderboard('all');
            
            // Load user stats
            loadUserStats();
            
            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    loadLeaderboard(btn.dataset.filter);
                });
            });
            
            // Start quiz
            document.querySelectorAll('.start-quiz-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const card = e.target.closest('.quiz-card');
                    const quizId = card.dataset.quiz;
                    startQuiz(quizId);
                });
            });
            
            // Logout
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await signOut(auth);
            });
        }
        
        async function loadLeaderboard(filterType) {
            const leaderboardDiv = document.getElementById('leaderboardList');
            try {
                let q;
                if (filterType === 'all') {
                    q = query(collection(db, 'organizations'), orderBy('totalScore', 'desc'), limit(20));
                } else {
                    q = query(collection(db, 'organizations'), where('type', '==', filterType), orderBy('totalScore', 'desc'), limit(20));
                }
                
                const snapshot = await getDocs(q);
                if (snapshot.empty) {
                    leaderboardDiv.innerHTML = '<div class="empty-state">No scores yet. Be the first!</div>';
                    return;
                }
                
                let rank = 1;
                leaderboardDiv.innerHTML = snapshot.docs.map(doc => {
                    const org = doc.data();
                    return `
                        <div class="leaderboard-item ${org.type === currentOrgType && org.name === currentOrgName ? 'current-org' : ''}">
                            <span class="rank">#${rank++}</span>
                            <i class="fas ${org.type === 'church' ? 'fa-church' : (org.type === 'parachurch' ? 'fa-hands-helping' : 'fa-user')}"></i>
                            <span class="org-name">${org.name}</span>
                            <span class="org-score">${org.totalScore || 0} pts</span>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                leaderboardDiv.innerHTML = '<div class="error">Error loading leaderboard</div>';
            }
        }
        
        async function loadUserStats() {
            if (!currentUser) return;
            
            try {
                // Get user's scores
                const scoresQuery = query(collection(db, 'scores'), where('userId', '==', currentUser.uid));
                const scoresSnapshot = await getDocs(scoresQuery);
                let bestScore = 0;
                scoresSnapshot.forEach(doc => {
                    bestScore = Math.max(bestScore, doc.data().score);
                });
                document.getElementById('userBestScore').innerText = bestScore || 'Not yet';
                
                // Get organization rank
                if (currentOrgType !== 'individual') {
                    const orgQuery = query(collection(db, 'organizations'), where('type', '==', currentOrgType), orderBy('totalScore', 'desc'));
                    const orgSnapshot = await getDocs(orgQuery);
                    let rank = 1;
                    orgSnapshot.forEach(doc => {
                        if (doc.data().name === currentOrgName) {
                            document.getElementById('orgRank').innerText = `#${rank}`;
                        }
                        rank++;
                    });
                } else {
                    document.getElementById('orgRank').innerText = 'N/A';
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        function startQuiz(quizId) {
            currentQuiz = SAMPLE_QUIZZES[quizId];
            quizQuestions = currentQuiz.questions;
            currentQuestionIndex = 0;
            userScore = 0;
            renderQuestion();
        }
        
        function renderQuestion() {
            if (currentQuestionIndex >= quizQuestions.length) {
                endQuiz();
                return;
            }
            
            const question = quizQuestions[currentQuestionIndex];
            appContainer.innerHTML = `
                <div class="quiz-container">
                    <div class="quiz-progress">
                        <span>Question ${currentQuestionIndex + 1} of ${quizQuestions.length}</span>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${((currentQuestionIndex + 1) / quizQuestions.length) * 100}%"></div>
                        </div>
                    </div>
                    
                    <div class="quiz-card active-quiz">
                        <h2 class="quiz-question">${question.text}</h2>
                        <div class="quiz-options">
                            ${question.options.map((opt, idx) => `
                                <button class="quiz-option" data-answer="${idx}">
                                    ${String.fromCharCode(65 + idx)}. ${opt}
                                </button>
                            `).join('')}
                        </div>
                        <div class="quiz-score">Current Score: ${userScore}</div>
                    </div>
                </div>
            `;
            
            document.querySelectorAll('.quiz-option').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const selectedAnswer = parseInt(btn.dataset.answer);
                    const isCorrect = (selectedAnswer === question.correct);
                    
                    if (isCorrect) {
                        userScore += 10;
                        btn.style.background = '#1e8449';
                        btn.style.color = 'white';
                    } else {
                        btn.style.background = '#5c061e';
                        btn.style.color = 'white';
                    }
                    
                    // Disable all options
                    document.querySelectorAll('.quiz-option').forEach(b => b.style.pointerEvents = 'none');
                    
                    // Show correct answer highlight
                    document.querySelectorAll('.quiz-option')[question.correct].style.background = '#1e8449';
                    document.querySelectorAll('.quiz-option')[question.correct].style.color = 'white';
                    
                    setTimeout(() => {
                        currentQuestionIndex++;
                        renderQuestion();
                    }, 1500);
                });
            });
        }
        
        async function endQuiz() {
            // Save score to Firestore
            try {
                await addDoc(collection(db, 'scores'), {
                    userId: currentUser.uid,
                    userName: currentUser.email,
                    orgType: currentOrgType,
                    orgName: currentOrgName,
                    quizId: currentQuiz.id,
                    score: userScore,
                    timestamp: new Date()
                });
                
                // Update organization total score
                if (currentOrgType !== 'individual') {
                    const orgRef = doc(db, 'organizations', currentOrgType + '_' + currentOrgName.replace(/\s/g, '_'));
                    const orgDoc = await getDoc(orgRef);
                    if (orgDoc.exists()) {
                        const newTotal = (orgDoc.data().totalScore || 0) + userScore;
                        await updateDoc(orgRef, {
                            totalScore: newTotal,
                            quizzesTaken: (orgDoc.data().quizzesTaken || 0) + 1
                        });
                    }
                }
                
                appContainer.innerHTML = `
                    <div class="quiz-complete">
                        <i class="fas fa-check-circle"></i>
                        <h2>Quiz Complete!</h2>
                        <div class="final-score">Your Score: ${userScore} / ${quizQuestions.length * 10}</div>
                        <p>Your score has been added to the leaderboard!</p>
                        <button id="backToDashboard" class="btn-primary">Back to Dashboard</button>
                    </div>
                `;
                
                document.getElementById('backToDashboard').addEventListener('click', () => {
                    renderDashboard();
                });
            } catch (error) {
                console.error('Error saving score:', error);
                alert('Error saving score. Please try again.');
                renderDashboard();
            }
        }
        
        // ============================================================
        // AUTH STATE LISTENER
        // ============================================================
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Load user profile from Firestore
                const userDoc = await getDoc(doc(db, 'users', user.uid));
                if (userDoc.exists()) {
                    currentOrgType = userDoc.data().orgType;
                    currentOrgName = userDoc.data().orgName;
                } else {
                    currentOrgType = 'individual';
                    currentOrgName = user.email.split('@')[0];
                }
                renderDashboard();
            } else {
                currentUser = null;
                renderAuth();
            }
        });
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Plus Jakarta Sans', 'Abyssinica SIL', sans-serif;
            background: linear-gradient(135deg, #fbf8f3 0%, #f5efe6 100%);
            min-height: 100vh;
            color: #2c2523;
        }
        
        /* Auth Styles */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(92, 6, 30, 0.1);
        }
        
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-section i {
            font-size: 48px;
            color: #b38f43;
        }
        
        .logo-section h1 {
            font-size: 36px;
            color: #5c061e;
            margin: 10px 0;
        }
        
        .subtitle {
            color: #6e6562;
            font-size: 14px;
        }
        
        .org-type-selector h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #5c061e;
        }
        
        .org-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .org-btn {
            padding: 15px 10px;
            border: 2px solid #e0d6cc;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        
        .org-btn i {
            font-size: 24px;
            display: block;
            margin-bottom: 8px;
            color: #b38f43;
        }
        
        .org-btn span {
            display: block;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .org-btn small {
            font-size: 10px;
            color: #6e6562;
        }
        
        .org-btn.selected {
            border-color: #b38f43;
            background: #f5f0e6;
        }
        
        .org-name-input {
            margin-bottom: 25px;
        }
        
        .org-name-input input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0d6cc;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0d6cc;
        }
        
        .tab-btn {
            padding: 10px 20px;
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 600;
            color: #6e6562;
        }
        
        .tab-btn.active {
            color: #5c061e;
            border-bottom: 2px solid #b38f43;
            margin-bottom: -2px;
        }
        
        .auth-form {
            display: none;
        }
        
        .auth-form.active {
            display: block;
        }
        
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 2px solid #e0d6cc;
            border-radius: 10px;
            font-size: 14px;
        }
        
        .btn-primary {
            width: 100%;
            padding: 12px;
            background: #5c061e;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .btn-primary:hover {
            background: #3e0414;
        }
        
        /* Dashboard Styles */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(92, 6, 30, 0.04);
        }
        
        .user-badge {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .user-badge i {
            font-size: 32px;
            color: #b38f43;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: none;
            border: 1px solid #e0d6cc;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .leaderboard-section, .quiz-section, .competitive-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(92, 6, 30, 0.04);
        }
        
        h2 {
            color: #5c061e;
            margin-bottom: 20px;
            font-size: 22px;
        }
        
        h2 i {
            color: #b38f43;
            margin-right: 10px;
        }
        
        .leaderboard-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            background: #f5f0e6;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .filter-btn.active {
            background: #b38f43;
            color: white;
        }
        
        .leaderboard-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .leaderboard-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            border-bottom: 1px solid #e0d6cc;
        }
        
        .leaderboard-item.current-org {
            background: #f5f0e6;
            border-radius: 8px;
            font-weight: 600;
        }
        
        .rank {
            font-weight: 700;
            color: #b38f43;
            width: 50px;
        }
        
        .org-name {
            flex: 1;
        }
        
        .org-score {
            font-weight: 700;
            color: #5c061e;
        }
        
        .quiz-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        
        .quiz-card {
            padding: 20px;
            border: 2px solid #e0d6cc;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .quiz-card:hover {
            transform: translateY(-5px);
            border-color: #b38f43;
        }
        
        .quiz-card i {
            font-size: 40px;
            color: #b38f43;
            margin-bottom: 15px;
        }
        
        .start-quiz-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #5c061e;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .stats-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        
        .stat {
            padding: 20px;
            background: #f5f0e6;
            border-radius: 12px;
            text-align: center;
        }
        
        .stat-label {
            display: block;
            color: #6e6562;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: #5c061e;
        }
        
        /* Quiz Styles */
        .quiz-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        
        .quiz-progress {
            margin-bottom: 30px;
        }
        
        .progress-bar {
            height: 8px;
            background: #e0d6cc;
            border-radius: 4px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #b38f43;
            transition: width 0.3s;
        }
        
        .active-quiz {
            text-align: center;
        }
        
        .quiz-question {
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .quiz-options {
            display: grid;
            gap: 12px;
            margin-bottom: 30px;
        }
        
        .quiz-option {
            padding: 15px;
            background: #f5f0e6;
            border: 2px solid #e0d6cc;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            font-size: 16px;
        }
        
        .quiz-option:hover {
            background: #e0d6cc;
        }
        
        .quiz-score {
            font-size: 18px;
            font-weight: 600;
            color: #5c061e;
        }
        
        .quiz-complete {
            text-align: center;
            padding: 60px 20px;
        }
        
        .quiz-complete i {
            font-size: 64px;
            color: #1e8449;
            margin-bottom: 20px;
        }
        
        .final-score {
            font-size: 32px;
            font-weight: 700;
            margin: 20px 0;
        }
        
        .loading, .empty-state, .error {
            text-align: center;
            padding: 40px;
            color: #6e6562;
        }
        
        @media (max-width: 768px) {
            .org-buttons {
                grid-template-columns: 1fr;
            }
            
            .quiz-question {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
</body>
</html>
